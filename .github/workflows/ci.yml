name: CI - Test & Validate

on:
  push:
    branches: [ main, backend, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: finuser
          POSTGRES_PASSWORD: finpass123
          POSTGRES_DB: financedb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install all service dependencies
        if [ -f microservices/shared/requirements.txt ]; then
          pip install -r microservices/shared/requirements.txt
        fi
        if [ -f microservices/transaction-service/requirements.txt ]; then
          pip install -r microservices/transaction-service/requirements.txt
        fi
        if [ -f microservices/ai-service/requirements.txt ]; then
          pip install -r microservices/ai-service/requirements.txt
        fi
        if [ -f microservices/api-gateway/requirements.txt ]; then
          pip install -r microservices/api-gateway/requirements.txt
        fi
        # Install test dependencies
        pip install pytest pytest-asyncio httpx bandit pytest-cov

    - name: Security check with Bandit
      run: |
        echo "Running security scan..."
        bandit -r microservices/ -ll -f json -o bandit-report.json || true
        bandit -r microservices/ -ll
      continue-on-error: false

    - name: Run database migrations
      env:
        DATABASE_URL: postgresql+asyncpg://finuser:finpass123@localhost:5432/financedb
        REDIS_URL: redis://localhost:6379/0
        JWT_SECRET_KEY: test-secret-key-for-ci-pipeline-must-be-at-least-64-chars-long
        ENVIRONMENT: test
      run: |
        cd microservices
        alembic upgrade head

    - name: Run unit tests
      env:
        DATABASE_URL: postgresql+asyncpg://finuser:finpass123@localhost:5432/financedb
        REDIS_URL: redis://localhost:6379/0
        JWT_SECRET_KEY: test-secret-key-for-ci-pipeline-must-be-at-least-64-chars-long
        ENVIRONMENT: test
      run: |
        pytest tests/unit/ -v --tb=short --cov=microservices --cov-report=xml
      # Unit tests MUST pass

    - name: Run concurrency tests (CRITICAL for fintech)
      env:
        DATABASE_URL: postgresql+asyncpg://finuser:finpass123@localhost:5432/financedb
        REDIS_URL: redis://localhost:6379/0
        JWT_SECRET_KEY: test-secret-key-for-ci-pipeline-must-be-at-least-64-chars-long
        ENVIRONMENT: test
      run: |
        pytest tests/concurrency/ -v --tb=short
      # MUST NOT fail - race conditions = money loss

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

    - name: Test summary
      if: always()
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "✅ Security checks passed" >> $GITHUB_STEP_SUMMARY
        echo "✅ Migrations successful" >> $GITHUB_STEP_SUMMARY
        echo "✅ Unit tests passed" >> $GITHUB_STEP_SUMMARY
        echo "✅ Concurrency tests passed (CRITICAL)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "See full test results in docs/TEST_RESULTS.md" >> $GITHUB_STEP_SUMMARY
