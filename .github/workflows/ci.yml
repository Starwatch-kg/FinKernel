name: CI - Test & Validate

on:
  push:
    branches: [ main, backend, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: finuser
          POSTGRES_PASSWORD: finpass123
          POSTGRES_DB: financedb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r microservices/shared/requirements.txt
        pip install -r microservices/transaction-service/requirements.txt
        pip install -r microservices/ai-service/requirements.txt
        pip install -r microservices/api-gateway/requirements.txt
        pip install pytest pytest-asyncio httpx bandit

    - name: Security check with Bandit
      run: |
        bandit -r microservices/ -ll -f json -o bandit-report.json || true
        bandit -r microservices/ -ll
      continue-on-error: false

    - name: Run database migrations
      env:
        DATABASE_URL: postgresql+asyncpg://finuser:finpass123@localhost:5432/financedb
        REDIS_URL: redis://localhost:6379/0
        JWT_SECRET_KEY: test-secret-key-for-ci-pipeline-must-be-at-least-64-chars-long
        ENVIRONMENT: test
      run: |
        cd microservices
        alembic upgrade head

    - name: Run concurrency tests (CRITICAL for fintech)
      env:
        DATABASE_URL: postgresql+asyncpg://finuser:finpass123@localhost:5432/financedb
        REDIS_URL: redis://localhost:6379/0
        JWT_SECRET_KEY: test-secret-key-for-ci-pipeline-must-be-at-least-64-chars-long
        ENVIRONMENT: test
      run: |
        pytest tests/concurrency/ -v --tb=short
      # MUST NOT fail - race conditions = money loss

    - name: Test summary
      if: always()
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "✅ Security checks passed" >> $GITHUB_STEP_SUMMARY
        echo "✅ Migrations successful" >> $GITHUB_STEP_SUMMARY
        echo "✅ Concurrency tests passed (CRITICAL)" >> $GITHUB_STEP_SUMMARY
